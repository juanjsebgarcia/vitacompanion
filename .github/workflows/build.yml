name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds in the VitaSDK image pinned in the Makefile.
      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitacompanion
          path: |
            build/vitacompanion.suprx
            build/vitacompanion_kernel.skprx
          if-no-files-found: error
